<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Calculator - Level 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <!-- Checklist: Display screen showing current input/result -->
        <div class="display">
            <div id="screen" class="screen">0</div>
        </div>

        <!-- Checklist: CSS Grid layout for buttons -->
        <div class="buttons-grid">
            <!-- Row 1 -->
            <button class="btn action-btn" data-action="clear">C</button>
            <button class="btn action-btn" data-action="delete">&;</button>
            <button class="btn operator-btn" data-operator="/">÷</button>
            <button class="btn operator-btn" data-operator="*">×</button>

            <!-- Row 2 -->
            <button class="btn num-btn" data-num="7">7</button>
            <button class="btn num-btn" data-num="8">8</button>
            <button class="btn num-btn" data-num="9">9</button>
            <button class="btn operator-btn" data-operator="-">−</button>

            <!-- Row 3 -->
            <button class="btn num-btn" data-num="4">4</button>
            <button class="btn num-btn" data-num="5">5</button>
            <button class="btn num-btn" data-num="6">6</button>
            <button class="btn operator-btn" data-operator="+">+</button>

            <!-- Row 4 -->
            <button class="btn num-btn" data-num="1">1</button>
            <button class="btn num-btn" data-num="2">2</button>
            <button class="btn num-btn" data-num="3">3</button>
            <button class="btn equals-btn" id="equals" data-action="equals">=</button>

            <!-- Row 5 -->
            <button class="btn num-btn zero-btn" data-num="0">0</button>
            <button class="btn num-btn" data-num=".">.</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>s
