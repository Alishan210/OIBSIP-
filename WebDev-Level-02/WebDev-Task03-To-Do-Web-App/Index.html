<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Master - To-Do Web App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="todo-app"
        <header class="app-header">
            <h1><i class="fa-solid fa-list-check"></i> TaskMaster</h1>
            <p>Organize your day efficiently</p>
        </header>

        <!-- Input & Add Task Form -->
        <form id="todoForm" class="todo-form">
            <input type="text" id="taskInput" placeholder="Add a new task..." required>
            <button type="submit" class="add-btn"><i class="fa-solid fa-plus"></i> Add Task</button>
        </form>

        <!-- Main Task Lists Container -->
        <div class="lists-container">
            
            <!-- Pending Tasks Section -->
            <section class="task-section">
                <div class="section-header">
                    <h2>Pending Tasks</h2>
                    <span id="pendingCount" class="badge pending-badge">0 pending</span>
                </div>
                <ul id="pendingList" class="task-list"></ul>
                <div id="pendingEmpty" class="empty-state">No pending tasks. Enjoy your day!</div>
            </section>

            <!-- Completed Tasks Section -->
            <section class="task-section">
                <div class="section-header">
                    <h2>Completed Tasks</h2>
                    <span id="completedCount" class="badge completed-badge">0 completed</span>
                </div>
                <ul id="completedList" class="task-list completed-style"></ul>
                <div id="completedEmpty" class="empty-state">No completed tasks yet.</div>
            </section>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
