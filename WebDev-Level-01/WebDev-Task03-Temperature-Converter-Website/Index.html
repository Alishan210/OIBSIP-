<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter Tool</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- Checklist: Clean, centred UI layout -->
    <div class="converter-card">
        <div class="card-header">
            <i class="fa-solid fa-temperature-half logo-icon"></i>
            <h2>TempConverter</h2>
            <p>Convert temperatures between Celsius, Fahrenheit & Kelvin</p>
        </div>

        <form id="tempForm" onsubmit="return false;">
            <!-- Checklist: Numeric input field -->
            <div class="input-group">
                <label for="tempInput">Enter Temperature:</label>
                <input type="number" id="tempInput" step="any" placeholder="e.g. 25" required>
            </div>

            <!-- Checklist: Unit selector dropdown -->
            <div class="input-group">
                <label for="unitSelect">From Unit:</label>
                <select id="unitSelect">
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>
            </div>

            <!-- Checklist: Convert button -->
            <button type="button" id="convertBtn" class="convert-btn">Convert Now</button>
        </form>

        <!-- Checklist: Error message display area -->
        <div id="errorMsg" class="error-msg hidden"></div>

        <!-- Checklist: Result display area showing all output units -->
        <div id="resultArea" class="result-area hidden">
            <h3>Converted Values:</h3>
            <div class="result-grid">
                <div class="result-box" id="celsiusBox">
                    <span class="unit-label">Celsius</span>
                    <span class="val" id="celsiusVal">--</span>
                </div>
                <div class="result-box" id="fahrenheitBox">
                    <span class="unit-label">Fahrenheit</span>
                    <span class="val" id="fahrenheitVal">--</span>
                </div>
                <div class="result-box" id="kelvinBox">
                    <span class="unit-label">Kelvin</span>
                    <span class="val" id="kelvinVal">--</span>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript File Link -->
    <script src="script.js"></script>
</body>
</html>
